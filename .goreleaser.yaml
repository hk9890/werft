version: 2

project_name: werft

builds:
  - id: werft
    main: ./cmd/werft
    binary: werft
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # The v keeps `werft version` equal to what `mise run build` stamps from
    # `git describe`.
    ldflags:
      - -s -w
      - -X github.com/hk9890/werft/internal/build.Version=v{{ .Version }}
      - -X github.com/hk9890/werft/internal/build.Commit={{ .ShortCommit }}
      - -X github.com/hk9890/werft/internal/build.Date={{ .Date }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: werft-archives
    ids:
      - werft
    formats:
      - tar.gz
    # The binary alone. A pattern that matches nothing replaces GoReleaser's
    # default of adding README, LICENSE and CHANGELOG.
    files:
      - none*
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release:
  # Re-dispatching against an existing tag replaces its assets instead of
  # failing (docs/RELEASING.md).
  replace_existing_artifacts: true
