version: 2

project_name: werft

builds:
  - id: werft
    main: ./cmd/werft
    binary: werft
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # The v keeps `werft version` equal to what `mise run build` stamps from
    # `git describe`.
    ldflags:
      - -s -w
      - -X github.com/hk9890/werft/internal/build.Version=v{{ .Version }}
      - -X github.com/hk9890/werft/internal/build.Commit={{ .ShortCommit }}
      - -X github.com/hk9890/werft/internal/build.Date={{ .Date }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: werft-archives
    ids:
      - werft
    formats:
      - tar.gz
    # The licenses of werft and of the modules it links must ship with the
    # binary.
    files:
      - LICENSE
      - THIRD_PARTY_LICENSES
      - README.md
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

# One SPDX SBOM per archive, made by syft.
sboms:
  - artifacts: archive

# Keyless (Sigstore) signature of the checksums file, which covers every
# archive. cosign 3.x writes one bundle: signature, certificate and log entry.
# Needs `id-token: write` and cosign on PATH (release.yml).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true

release:
  # Re-dispatching against an existing tag replaces its assets instead of
  # failing (docs/RELEASING.md).
  replace_existing_artifacts: true

# The release notes are the version's CHANGELOG.md section, passed with
# --release-notes (scripts/release-notes), not a commit list. The changelog
# pipe is what reads that file, so it must stay enabled: `changelog.disable`
# skips the pipe and publishes a release with an empty body. A notes file
# suppresses the commit list on its own.
