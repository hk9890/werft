name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so vuln finds advisories published while nothing merges. The time
  # is the one task-manager and task-manager-ui use.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# A new push to a PR branch cancels the run of its older commit. On main every
# merge commit keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # TestZshCompletes drives the completion script in zsh.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - id: quality
        run: mise run quality
      # Reaches the network for the vulnerability database, so it runs here
      # rather than in the pre-commit gate. It also runs when quality failed,
      # but not when the setup failed.
      - run: mise run vuln
        if: ${{ !cancelled() && steps.quality.outcome != 'skipped' }}
