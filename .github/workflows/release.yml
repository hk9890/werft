name: Release

# Releases are published by dispatching this workflow by hand against a release
# tag (docs/RELEASING.md). workflow_dispatch rather than `push: tags: v*` so
# that re-tagging or history maintenance cannot publish a release by accident.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs third-party code (modules, tests, linters), so it gets no write token.
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a ref that is not a tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "dispatch this workflow on a release tag, not on $GITHUB_REF" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails in seconds on a tag without a CHANGELOG.md section.
      - run: scripts/release-notes "$GITHUB_REF_NAME" > /dev/null
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # TestZshCompletes drives the completion script in zsh.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - run: mise run quality

  release:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Go and GoReleaser at the versions .mise.toml pins; nothing else.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: go goreleaser
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - run: goreleaser release --clean --release-notes "$RUNNER_TEMP/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
